name: Jekyll site CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      GA_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}

    steps:
    - uses: actions/checkout@v4

    - name: 密钥扫描规则自检（防止规则本身回归）
      run: bash scripts/scan-secrets.sh --self-test

    - name: 密钥扫描（防止误提交）
      run: bash scripts/scan-secrets.sh

    - name: 设置 Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version-file: .ruby-version
        bundler-cache: true

    - name: 设置页面缓存
      uses: actions/configure-pages@v3

    - name: 安装依赖
      run: bundle install

    - name: 检查 Secrets（缺失则降级，不再硬失败）
      id: secrets_check
      run: |
        # fork PR 拿不到 secrets，正常 push 才有。
        # 缺失时跳过统计脚本注入，让构建仍然成功。
        # 注：评论组件是 Giscus，凭证由 GitHub App 侧持有，仓库不需要任何 secret，
        #     故 GA 是这里唯一的判据（历史上混入 Gitalk 凭证判断，导致 GA 校验被连坐跳过）。
        if [ -z "$GA_ID" ]; then
          echo "::warning::GOOGLE_ANALYTICS_ID 未配置，将跳过统计脚本注入"
          echo "ga_ok=false" >> "$GITHUB_OUTPUT"
        else
          echo "✓ GOOGLE_ANALYTICS_ID 已配置 (长度: ${#GA_ID})"
          echo "ga_ok=true" >> "$GITHUB_OUTPUT"
        fi

    - name: 创建密钥配置（只写已配置的字段，避免空值进 HTML）
      run: |
        rm -f _config_secrets.yml
        {
          echo "# Auto-generated secrets configuration (DO NOT COMMIT)"
          if [ -n "$GA_ID" ]; then
            echo "google_analytics: $GA_ID"
          fi
        } > _config_secrets.yml
        echo "_config_secrets.yml 结构（敏感值已隐去）:"
        sed -E 's/(google_analytics):.*/\1: ***REDACTED***/' _config_secrets.yml

    - name: 构建站点
      run: |
        echo "JEKYLL_ENV: $JEKYLL_ENV"
        bundle exec jekyll build --config _config.yml,_config_secrets.yml --trace

    - name: 验证构建产物（CSP / SRI / 条件注入）
      run: |
        FAIL=0
        # 1. CSP 必须存在
        if grep -q "Content-Security-Policy" _site/index.html; then
          echo "✓ CSP meta 已注入"
        else
          echo "::error::CSP meta 缺失"; FAIL=1
        fi
        # 2. SRI 必须存在（任一 integrity 即可）
        if grep -q 'integrity="sha384-' _site/index.html; then
          echo "✓ SRI integrity 已注入"
        else
          echo "::error::SRI integrity 缺失"; FAIL=1
        fi
        # 3. 不允许出现 @latest（防回归）；仅扫描产物中的 HTML / JS / CSS
        if grep -rln --include='*.html' --include='*.js' --include='*.css' \
             'cdn.jsdelivr.net/npm/[^"]*@latest' _site/ ; then
          echo "::error::发现 @latest 引用，必须锁定具体版本"; FAIL=1
        else
          echo "✓ 未发现 @latest"
        fi
        # 4a. 统计脚本：仅在 GA_ID 配置时要求注入
        if [ "${{ steps.secrets_check.outputs.ga_ok }}" = "true" ]; then
          grep -rq "gtag('config'" _site/ \
            && echo "✓ 统计脚本已注入" \
            || { echo "::error::统计脚本未注入但 GOOGLE_ANALYTICS_ID 已配置"; FAIL=1; }
        else
          echo "（GOOGLE_ANALYTICS_ID 未配置，跳过统计脚本验证）"
        fi
        # 4b. 评论组件（Giscus）：配置全在 _config.yml，无 secret 依赖，
        #     故任何构建都必须注入——fork PR 也一样。
        if grep -rq "giscus.app/client.js" _site/; then
          echo "✓ 评论组件（Giscus）已注入"
        else
          echo "::error::评论组件未注入（检查 _config.yml 的 giscus.enable / repo_id）"; FAIL=1
        fi
        # 5. aitm 产品页与下载资源齐全
        if [ -f _site/aitm/index.html ] && grep -q "aitm" _site/aitm/index.html; then
          echo "✓ aitm 产品页已渲染"
        else
          echo "::error::aitm 产品页缺失或内容不完整"; FAIL=1
        fi
        # 5.1 多语言（i18n）3 套页面齐全
        for lang_path in "" "zh/" "ja/"; do
          for page in "" "about/" "aitm/" "arcade/" "projects/" "search/" "tags/"; do
            file="_site/${lang_path}${page}index.html"
            if [ -f "$file" ]; then
              echo "✓ /${lang_path}${page}"
            else
              echo "::error::缺失多语言页面 /${lang_path}${page}"; FAIL=1
            fi
          done
        done
        # 5.2 hreflang 注入校验：每个产品页都应含 4 条 alternate（en/zh/ja/x-default）
        for lang_path in "" "zh/" "ja/"; do
          count=$(grep -oE 'rel="alternate" hreflang="[^"]+"' "_site/${lang_path}aitm/index.html" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -ge 4 ]; then
            echo "✓ /${lang_path}aitm/ 含 $count 条 hreflang"
          else
            echo "::error::/${lang_path}aitm/ hreflang 数量不足: $count（应 ≥4）"; FAIL=1
          fi
        done
        # 5.3 邮箱不应作为连续字符串出现在任何 HTML 产物中
        if grep -rln "slbluefox@gmail.com" _site/ 2>/dev/null; then
          echo "::error::邮箱明文出现在产物中"; FAIL=1
        else
          echo "✓ 邮箱明文未泄露"
        fi
        # aitm 兼容垫片（assets/aitm/latest.json）
        # aitm 自 v1.0.0 起改从 GitHub Releases API 取更新（内部仓 c3f6439「废弃博客中转」），
        # 安装包也全部由 GitHub Releases 分发，博客不再托管任何 aitm 二进制。
        # 本文件只为 v0.10.6 及更早的遗留客户端保留：它们仍会来拉这个 URL，
        # 拿到一个足够新的 version 才会提示用户升级（升级后客户端自带 updater 接管）。
        if [ -f _site/assets/aitm/latest.json ]; then
          JSON_VERSION=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' _site/assets/aitm/latest.json | sed -E 's/.*"([^"]+)"$/\1/')
          JSON_URL=$(grep -oE '"download_url"[[:space:]]*:[[:space:]]*"[^"]+"' _site/assets/aitm/latest.json | sed -E 's/.*"([^"]+)"$/\1/')
          if [ -z "$JSON_VERSION" ] || [ -z "$JSON_URL" ] || ! grep -q '"notes"' _site/assets/aitm/latest.json; then
            echo "::error::latest.json 缺 version / download_url / notes 字段"; FAIL=1
          elif ! echo "$JSON_URL" | grep -q '^https://github\.com/kanfu-panda/aitm/releases/'; then
            echo "::error::latest.json download_url 必须指向 GitHub Releases，实为 $JSON_URL"; FAIL=1
          elif ! echo "$JSON_URL" | grep -qF "$JSON_VERSION"; then
            echo "::error::latest.json download_url 未包含 version $JSON_VERSION"; FAIL=1
          else
            echo "✓ latest.json 垫片有效（version=$JSON_VERSION → GitHub Releases）"
          fi
        else
          echo "::error::assets/aitm/latest.json 缺失（v0.10.6 及更早的遗留客户端依赖）"; FAIL=1
        fi
        [ $FAIL -eq 0 ] || exit 1

    - name: 上传构建产物
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

    - name: 清理缓存
      if: always()
      run: bundle clean --force

  # 部署仅在 main 分支触发，独立 job 携带 environment（避免 PR 触发时被环境保护规则拒绝）
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        timeout: 600000
